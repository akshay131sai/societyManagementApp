[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests
pythonpath = .
addopts = -q --strict-markers --tb=short
filterwarnings =
    ignore::DeprecationWarning:asyncio
    ignore:.*WindowsSelectorEventLoopPolicy.*:DeprecationWarning
    ignore:.*event_loop_policy.*:DeprecationWarning
