# Local development database.
#
# Runs on port 5433 so it cannot collide with a PostgreSQL already installed on
# the host. The application user is the container superuser because tenant
# provisioning issues CREATE DATABASE.
#
# Production does NOT use this file — see docs/deployment/deployment.md, where
# the application role is deliberately not a superuser and a separate
# `nestflow_provisioner` role holds CREATEDB.

services:
  postgres:
    image: postgres:17-alpine
    container_name: nestflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nestflow
      POSTGRES_PASSWORD: nestflow_dev_pw
      POSTGRES_DB: nestflow_platform
    ports:
      - "5433:5432"
    volumes:
      - nestflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestflow -d nestflow_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB

volumes:
  nestflow_pgdata:
